name: Android APK

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: APK derle
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: APK'yı adlandır
        run: cp android/app/build/outputs/apk/release/app-release.apk evkamera.apk

      - name: İndirme sayfasına koy
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: EvKamera 0.1.${{ github.run_number }}
          body: "Kamera telefonuna kurulacak Android uygulaması. İndir: evkamera.apk"
          files: evkamera.apk
          make_latest: true
